<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- Navigation -->
        <div id="navigation" class="navigation hidden">
            <div>
                <a href="#" id="nav-dashboard">Dashboard</a>
                <a href="#" id="nav-add-employee">Add Employee</a>
            </div>
            <div>
                <a href="#" id="nav-logout">Logout</a>
            </div>
        </div>

        <!-- Login Page -->
        <div id="login-page" class="login-container">
            <h2>Employee Management System</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard-page" class="dashboard hidden">
            <h2>Employee List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employee-table-body"></tbody>
            </table>
        </div>

        <!-- Add / Edit Employee -->
        <div id="employee-form-page" class="employee-form hidden">
            <h2 id="form-title">Add Employee</h2>
            <form id="employee-form">
                <input type="hidden" id="employee-id">

                <input type="text" id="first-name" placeholder="First Name" required>
                <input type="text" id="last-name" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>

                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                </select>

                <input type="number" id="salary" placeholder="Salary" required>
                <input type="date" id="hire-date" required>

                <button type="submit" id="save-employee-btn">
                    Save Employee
                </button>
            </form>
        </div>

    </div>

    <!-- JavaScript Files (CORRECT ORDER) -->
    <script src="employeeauth.js"></script>
    <script src="employeelist.js"></script>
    <script src="addemployee.js"></script>

</body>
</html>
